[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "convergence-factory"
version = "0.3.0"
description = "A layered evidence pipeline for finding duplicate functionality and convergence opportunities across a heterogeneous repository portfolio."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The factory runs with zero third-party deps. These sharpen individual probes.
sql = ["sqlglot>=23"]
config = ["pyyaml>=6"]
orchestration = ["prefect>=2"]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.4"]


[project.scripts]
convergence-factory = "convergence_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
